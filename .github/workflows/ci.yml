name: ci
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
jobs:
  ip:
    uses: Tape-Out/.github/.github/workflows/ip.yml@main
    permissions:
      contents: write
    with:
      # 整片测试：ran asic 用 sv2v 与 yosys 展平出交付的 .v，测试台跑在 Verilator 上，程序用裸机的 RISC-V GCC 编
      apt: yosys verilator gcc-riscv64-unknown-elf qemu-system-riscv
      pip: pyyaml
      sv2v: v0.0.13
