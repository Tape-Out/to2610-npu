name: to2610-npu
version: 0.1.0
spec: '0.1'
kind: ip
lang: verilog
identity:
  slug: to2610-npu
  display_name: Linux single-core chip with an MLP engine
  summary: 'A Linux chip with an on-chip MLP engine for the ECOS 2610 shuttle: the KianV RV32IMA Sv32 SoC of to2610-kvc with the int4 multiply-accumulate engine of TinyQV on its bus, driven from Linux through /dev/npu.'
  category: soc
  subcategories:
  - riscv
  ip_family: kianriscv
  integration_profile: []
  maturity: simulated
contract:
  version: 1
  ctrl:
    shape: none
    aw: 32
    dw: 32
deps:
  gf180mcu-kianv-rv32ima-sv32: ^0.1
  ttsky25a-tinyqv: ^0.1
  to2610-kvc: ^0.1
emit:
- kind: foreign
  lang: sv
  top: chip_core
  # 源码树是拼出来的：上游 SoC 套一个补丁，加引擎本体与适配模块
  setup: src
  rtl:
  - build/src/chip_core.sv
  - { glob: "build/src/*.v" }
  - build/src/sdram/mt48lc16m16a2_ctrl.v
  - { glob: "build/src/kianv_harris_edition/*.v" }
  includes:
  - build/src
  - build/src/kianv_harris_edition
  # 与 to2610-kvc 交付的那一颗同一组取值
  defines:
    SYSTEM_CLK: 50000000
    NUM_ENTRIES_ITLB: 32
    NUM_ENTRIES_DTLB: 32
    TRP_NS: 15
    TRCD_NS: 15
    TRFC_NS: 66
    TWR_NS: 15
    CAS: 2
    TREFI_NS: 7800
    BYPASS_CACHES: 1
    SYNTHESIS: 1
  clock:
    port: clk
  reset:
    port: rst_n
    active: low
    sync: false
  ports:
  - endpoint: pads
    kind: physical
    type: KianvPads
    map:
      i: bidir_in
      o: bidir_out
      oe: bidir_oe
      cs: bidir_cs
      sl: bidir_sl
      ie: bidir_ie
      pu: bidir_pu
      pd: bidir_pd
  limits:
  - 引擎一次乘加四对 int4，累加器 16 位；一层全连接要软件把权重与输入四个四个地喂
  - 缓存旁路、SDRAM 固定 32 MiB、主频固定 50 MHz，同 to2610-kvc
asic:
  top: to2610_npu
  frame: mpc
  mhz: 50
  flow: syn_sta
  # 引脚与 to2610-kvc 逐位相同：两颗用同一块板子
  pads:
  - { in: bidir_in, out: bidir_out, oe: bidir_oe }
  unused: [bidir_cs, bidir_sl, bidir_ie, bidir_pu, bidir_pd]
tasks:
  src:
    desc: 拼源码树：上游 KianV SoC 套上 patch/soc.patch，加 TinyQV 仓里的引擎与本仓的适配模块
    run: bash htest/setup.sh {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.ttsky25a-tinyqv}}
  chip:
    desc: 出流片的 .v，在它上面跑 to2610-kvc 的两段、引擎的裸机测试，以及 Linux 下经驱动认 MNIST
    run: bash htest/chip.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.to2610-kvc}}
    timeout: 21000
  webnn:
    desc: 随片的 MNIST 模型用 WebNN 建图计算，与基线、与 soft_fc 逐项比；改一个权要不同
    run: bash htest/webnn.sh {{out}}
    timeout: 1800
  pocl:
    desc: 编带 tnpu 设备的 PoCL，经 OpenCL 的内建内核 pocl.dnn.dense.relu.i8 在引擎的 RTL 上跑 MNIST 与随机层，与 soft_fc 逐项比
    run: bash htest/pocl.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.ttsky25a-tinyqv}}
    timeout: 1800
  pocl-faults:
    desc: tnpu 设备里逐个改掉一处（权的位置、权的行、ReLU、偏置），PoCL 那一层要红，四处
    run: bash htest/pocl-faults.sh {{out}} {{dep.gf180mcu-kianv-rv32ima-sv32}} {{dep.ttsky25a-tinyqv}}
    timeout: 3600
test:
  upstream:
  - { name: chip, task: chip, timeout: 21000 }
  - { name: webnn, task: webnn, timeout: 1800 }
  - { name: pocl, task: pocl, timeout: 1800 }
  - { name: pocl-faults, task: pocl-faults, timeout: 3600 }
targets:
  foreign:
    driver: foreign
